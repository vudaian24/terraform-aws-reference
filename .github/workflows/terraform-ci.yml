name: terraform-ci

on:
  pull_request:
    paths:
      - "modules/**"
      - "envs/**"
      - "bootstrap/**"
      - "examples/**"
      - ".github/workflows/terraform-ci.yml"

permissions:
  contents: read
  pull-requests: write

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.11.0"

      # Runs from the repo root so it covers modules/, envs/*, bootstrap/, and
      # examples/ in one pass — per-directory matrix would miss modules/ since
      # `-recursive` only walks a directory's own subtree, not siblings.
      - name: terraform fmt -check
        run: terraform fmt -check -recursive

  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Every root config, plus every implemented module validated directly
        # (not just transitively through whichever root happens to call it —
        # bootstrap/envs/* wiring could change later and silently drop
        # coverage). All 10 modules are implemented as of v0.1 — nothing left
        # to add here.
        working-directory:
          - bootstrap
          - envs/dev
          - envs/prod
          - modules/network
          - modules/gha-oidc
          - modules/database
          - modules/cache
          - modules/queue
          - modules/static-site
          - modules/acm-dns
          - modules/alb
          - modules/ecs-service
          - modules/eks-cluster
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.11.0"

      - name: terraform init (no backend)
        working-directory: ${{ matrix.working-directory }}
        run: terraform init -backend=false -input=false

      - name: terraform validate
        working-directory: ${{ matrix.working-directory }}
        run: terraform validate

      # Plan is intentionally not run here: envs/dev and envs/prod have no
      # real backend.hcl/terraform.tfvars in CI (gitignored on purpose), and
      # `terraform init -backend=false` can't be followed by a real plan
      # against an env that declares an actual S3 backend (Terraform correctly
      # refuses — "Backend initialization required"). Add a plan job once CI
      # has a way to supply real backend/tfvars values (e.g. from repo/
      # environment vars) — validate is as far as this can go without that.
